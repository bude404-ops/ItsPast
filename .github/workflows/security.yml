name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - name: Basic secret pattern scan
        run: |
          ! grep -RInE "(sk_live_|password=|private_key)" --exclude-dir=.git --exclude-dir=node_modules --exclude=security.yml .
